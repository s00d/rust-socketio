[workspace]
members = [
    "crates/socketio-next",
    "crates/socketio-next-testing",
    "crates/tauri-plugin-socketio",
    "examples",
]
# "2", not edition 2024's "3": the lockfile is for development and CI and takes the newest
# releases (security fixes included). MSRV is checked by `just msrv` with a lockfile resolved
# for the rust-version, as a downstream project would.
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/s00d/rust-socketio"
homepage = "https://github.com/s00d/rust-socketio"
authors = ["Pavel Kuzmin", "Bastian Kersting <bastian@cmbt.de>"]

[workspace.dependencies]
# Internal crates
socketio-next = { path = "crates/socketio-next", version = "0.1.0", default-features = false }
socketio-next-testing = { path = "crates/socketio-next-testing" }

# Shared external
base64 = "0.23"
bytes = "1.10"
futures-util = { version = "0.3.31", default-features = false, features = ["sink", "std"] }
http = "1.3"
native-tls = "0.2.14"
reqwest = { version = "0.13", default-features = false }
rustls = { version = "0.23.31", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1.12", features = ["std"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0"
tokio = "1.45"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
tracing = { version = "0.1.41", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3.19", default-features = false, features = ["fmt", "env-filter", "ansi"] }
url = "2.5.4"
webpki-roots = "1.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

# ---------------------------------------------------------------------------
# Profiles
# ---------------------------------------------------------------------------
# - `dev`: line tables for workspace crates, no debuginfo for registry deps
# - `ci`:  no debuginfo, no incremental (`just` recipes; output in target/ci)
# `split-debuginfo = "off"`: on macOS "unpacked" leaves every codegen unit's `.o` behind.

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "off"

[profile.dev.package."*"]
debug = false

[profile.ci]
inherits = "dev"
debug = 0
incremental = false

[profile.ci.package."*"]
debug = false
