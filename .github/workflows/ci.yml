name: CI

# Every step is a `just` recipe (see justfile), so CI and local runs are the same commands.
# Push to main / pull request: clippy and every test on Linux, every test on macOS and on
# Windows (one job each), and the `misc` checks. By hand (Actions -> CI -> Run workflow): with
# an empty version, the extended checks; with a version, the release (PUBLISHING.md).
#
# The socket.io / engine.io fixtures run in-process (socketio-next-testing::fake); the Node
# servers of ci/ are still started for the differential (conformance) tests, connection
# state recovery, cookies and TLS.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Version to release, e.g. 0.2.0 (no leading v). Empty: extended checks."
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  # A manual run may be a release: never cancel it.
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  CARGO_TERM_COLOR: always
  # Pinned so new clippy lints / rustdoc checks cannot break CI unannounced; the extended
  # job's latest-stable clippy warns about them early. Bump deliberately.
  RUST_TOOLCHAIN: "1.100.0"
  MSRV_TOOLCHAIN: "1.85"

jobs:
  # One job per OS. Linux also runs clippy (workspace, feature pairs) and the guest-js checks;
  # macOS and Windows run the same tests (paths, sockets, TLS backends differ there).
  test:
    name: tests on ${{ matrix.os }}
    if: github.event_name != 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      # tauri (tauri-plugin-socketio) links gtk and webkit2gtk on Linux
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev
      # pnpm's version comes from the plugin's package.json `packageManager`
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: crates/tauri-plugin-socketio/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ci/package-lock.json
            ci/conformance/package-lock.json
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      # just's GitHub release asset answered 504 on the macOS runners (Nov 2026): Homebrew there
      - if: runner.os == 'macOS'
        run: brew install just
      - uses: taiki-e/install-action@v2
        with:
          tool: ${{ runner.os == 'Linux' && 'just,cargo-hack,cargo-nextest,cargo-shear' || runner.os == 'macOS' && 'cargo-hack,cargo-nextest' || 'just,cargo-hack,cargo-nextest' }}
      - uses: Swatinem/rust-cache@v2
      - run: just servers-setup
      # Later steps run even if an earlier one failed, so one run shows every failure.
      - if: runner.os == 'Linux'
        run: just lint
      # The Node servers run in the background of this step.
      - if: ${{ !cancelled() }}
        run: just servers && just test && just plugin-rust
      - if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: just plugin-js
      - name: Node server logs
        if: ${{ failure() }}
        run: for f in ci/logs/*.log; do echo "== ${f}"; cat "${f}"; done

  misc:
    name: fmt, docs, deny, package, MSRV
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # rustdoc and the package build compile the plugin: tauri links gtk / webkit2gtk
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: rustup toolchain install "${MSRV_TOOLCHAIN}" --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-deny
      - uses: Swatinem/rust-cache@v2
      - run: just fmt
      - if: ${{ !cancelled() }}
        run: just docs
      - if: ${{ !cancelled() }}
        run: just deny
      - if: ${{ !cancelled() }}
        run: just package
      - if: ${{ !cancelled() }}
        run: just msrv

  # Slow or rarely-breaking checks, by hand before a release.
  extended:
    name: Extended
    if: github.event_name == 'workflow_dispatch' && inputs.release == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: crates/tauri-plugin-socketio/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: rustup toolchain install stable --profile minimal --component clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-semver-checks
      - uses: Swatinem/rust-cache@v2
      - run: just semver
      - if: ${{ !cancelled() }}
        run: just plugin-example
      - name: clippy on latest stable (non-blocking)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: cargo +stable clippy --workspace --all-features --all-targets --profile ci --locked -- -D warnings

  # Release X.Y.Z (Run workflow with a version), both crates with one version:
  # 1. checks CI: green on `main` HEAD, or on an earlier commit with only docs / *.md /
  #    justfile changed since;
  # 2. `just release-prep X.Y.Z`: versions (crates, npm package), Cargo.lock, [Unreleased] ->
  #    [X.Y.Z] in both changelogs (fails when the root [Unreleased] is empty); `just semver`;
  # 3. commits `chore: release vX.Y.Z` to `main`, tags `socketio-next-vX.Y.Z` and
  #    `tauri-plugin-socketio-vX.Y.Z`;
  # 4. publishes socketio-next, then tauri-plugin-socketio, with crates.io trusted publishing,
  #    and tauri-plugin-socketio-api with npm trusted publishing (no stored tokens);
  # 5. creates a GitHub release per tag from its changelog section.
  # Re-running with the same version resumes once the tags exist: it publishes only what is
  # not on crates.io / npm yet and creates the GitHub releases that are missing.
  release:
    name: release v${{ inputs.release }}
    if: github.event_name == 'workflow_dispatch' && inputs.release != ''
    runs-on: ubuntu-latest
    # crates.io and npm trusted publishers name workflow `ci.yml`, environment `crates-io`.
    environment: crates-io
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ inputs.release }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Version and state
        id: state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::'${VERSION}' is not a version like 0.2.0"; exit 1; }
          if git rev-parse -q --verify "refs/tags/socketio-next-v${VERSION}" >/dev/null; then
            echo "tag socketio-next-v${VERSION} exists: resuming (publish + GitHub releases only)"
            git checkout -q "socketio-next-v${VERSION}"
            echo "resume=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The newest `main` commit with a green CI run; after it only docs, *.md and the
          # justfile may have changed (the release runs the recipes it needs itself).
          green=""
          for c in $(git rev-list --first-parent -n 50 HEAD); do
            status="$(gh run list --workflow CI --commit "${c}" --event push --json conclusion --jq '.[0].conclusion // "none"')"
            if [[ "${status}" == success ]]; then green="${c}"; break; fi
          done
          [[ -n "${green}" ]] || { echo "::error::no green CI run among the last 50 main commits"; exit 1; }
          code="$(git diff --name-only "${green}" HEAD | grep -vE '^(docs/|justfile$|LICENSE$)|\.md$' || true)"
          if [[ -n "${code}" ]]; then
            echo "::error::CI is not green for these changes since ${green:0:7}: ${code//$'\n'/ }; wait for CI on main"
            exit 1
          fi
          echo "CI green on ${green:0:7}; changed since: $(git diff --name-only "${green}" HEAD | tr '\n' ' ')"
          echo "resume=false" >> "$GITHUB_OUTPUT"
      # the plugin's package build and semver-checks compile tauri: gtk / webkit2gtk
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: crates/tauri-plugin-socketio/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-semver-checks
      - uses: Swatinem/rust-cache@v2
      - name: Bump, changelogs, semver
        if: steps.state.outputs.resume != 'true'
        run: |
          just release-prep "${VERSION}"
          just semver
          just package --allow-dirty
      - name: Commit and tag
        if: steps.state.outputs.resume != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: release v${VERSION}"
          for c in socketio-next tauri-plugin-socketio; do
            git tag -a "${c}-v${VERSION}" -m "${c} v${VERSION}"
          done
          git push origin HEAD:main "socketio-next-v${VERSION}" "tauri-plugin-socketio-v${VERSION}"
      - id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          # dependency order; a crate already at this version is skipped (resume)
          for c in socketio-next tauri-plugin-socketio; do
            if cargo info --registry crates-io "${c}@${VERSION}" >/dev/null 2>&1; then
              echo "${c} ${VERSION} already on crates.io"
            else
              cargo publish -p "${c}" --locked
            fi
          done
      - name: Publish to npm
        working-directory: crates/tauri-plugin-socketio
        run: |
          if npm view "tauri-plugin-socketio-api@${VERSION}" version >/dev/null 2>&1; then
            echo "tauri-plugin-socketio-api ${VERSION} already on npm"; exit 0
          fi
          # trusted publishing (OIDC, no token) needs npm 11.5.1+
          npm install -g npm@latest
          pnpm install --frozen-lockfile
          pnpm build
          npm publish --access public
      - name: GitHub releases from the changelogs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release() {
            local tag="$1" changelog="$2" latest="$3"
            if gh release view "${tag}" >/dev/null 2>&1; then echo "GitHub release ${tag} exists"; return; fi
            just release-notes "${VERSION}" "${changelog}" > "$RUNNER_TEMP/${tag}.md"
            gh release create "${tag}" --title "${tag}" "${latest}" --notes-file "$RUNNER_TEMP/${tag}.md"
            gh release view "${tag}" --json body --jq .body | head -5
          }
          release "tauri-plugin-socketio-v${VERSION}" crates/tauri-plugin-socketio/CHANGELOG.md --latest=false
          release "socketio-next-v${VERSION}" CHANGELOG.md --latest
