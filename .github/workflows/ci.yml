name: CI

# Every step is a `just` recipe (see justfile), so CI and local runs are the same commands.
# Pull requests run the Linux job only (runner minutes). Run by hand (Actions -> CI -> Run
# workflow, or `gh workflow run ci.yml --ref <branch>`) for Linux, macOS and Windows, e.g.
# before a release. Nothing here publishes anything.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Pinned so new clippy lints / rustdoc checks cannot break CI unannounced. Bump deliberately.
  RUST_TOOLCHAIN: "1.99.1"
  MSRV_TOOLCHAIN: "1.85"

jobs:
  # One job per OS: ubuntu on pull requests, all three on workflow_dispatch. Ubuntu also runs
  # the static checks (fmt, cargo-shear + clippy, docs, cargo-deny, package, MSRV). Every job
  # runs the core tests, then the Tauri plugin's Rust and guest-js tests, against the Node
  # servers of ci/.
  ci:
    name: CI on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      # tauri (tauri-plugin-socketio) links gtk and webkit2gtk on Linux
      - name: Linux system deps (webkit for tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      # pnpm's version comes from the plugin's package.json `packageManager`
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: crates/tauri-plugin-socketio/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ci/package-lock.json
            ci/conformance/package-lock.json
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      - if: runner.os == 'Linux'
        run: rustup toolchain install "${MSRV_TOOLCHAIN}" --profile minimal
      # just's GitHub release asset answered 504 on the macOS runners (Nov 2026): Homebrew there
      - if: runner.os == 'macOS'
        run: brew install just
      - uses: taiki-e/install-action@v2
        with:
          tool: ${{ runner.os == 'Linux' && 'just,cargo-hack,cargo-deny,cargo-shear' || runner.os == 'macOS' && 'cargo-hack' || 'just,cargo-hack' }}
      - uses: Swatinem/rust-cache@v2
      # Static checks (Linux). Later steps run even if an earlier one failed, so one run shows
      # every failure.
      - if: runner.os == 'Linux'
        run: just fmt
      - if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: just lint
      - if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: just docs
      - if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: just deny
      - if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: just package
      - if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: just msrv
      - if: ${{ !cancelled() }}
        run: just servers-setup
      # The servers run in the background of this step; the tests trust ci/cert/ca.crt in-process.
      - if: ${{ !cancelled() }}
        run: just servers && just test && just plugin
      - name: Server logs
        if: ${{ failure() }}
        run: for f in ci/logs/*.log; do echo "== ${f}"; cat "${f}"; done
