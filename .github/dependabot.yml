version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      patches:
        applies-to: version-updates
        update-types: ["patch", "minor"]
  - package-ecosystem: "npm"
    directories: ["/ci", "/ci/conformance"]
    schedule:
      interval: "monthly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
