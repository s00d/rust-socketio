[package]
name = "rust_socketio"
version = "0.6.0"
authors = ["Bastian Kersting <bastian@cmbt.de>"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "An implementation of a socketio client written in rust."
readme = "../README.md"
keywords = ["socketio", "engineio", "network", "protocol", "client"]
categories = ["network-programming", "web-programming", "web-programming::websocket"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
rust_engineio = { version = "0.6.0", path = "../engineio", default-features = false }
bytes.workspace = true
futures-util = { workspace = true, optional = true }
log.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true, features = ["rt", "sync", "time", "macros"] }
url.workspace = true

[dev-dependencies]
serial_test = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "test-util"] }

[features]
default = ["async", "sync", "rustls"]
## Async (tokio) client: `rust_socketio::asynchronous`.
async = ["async-callbacks", "rust_engineio/async", "dep:tokio", "dep:futures-util"]
async-callbacks = []
## Blocking client: `rust_socketio::{ClientBuilder, Client, RawClient}`.
sync = ["rust_engineio/sync"]
## TLS backends, see rust_engineio.
rustls = ["rust_engineio/rustls"]
native-tls = ["rust_engineio/native-tls"]

[[example]]
name = "async"
path = "examples/async.rs"
required-features = ["async"]

[[example]]
name = "callback"
required-features = ["sync"]

[[example]]
name = "readme"
required-features = ["sync"]

[[example]]
name = "secure"
required-features = ["sync"]
