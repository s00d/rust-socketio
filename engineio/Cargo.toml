[package]
name = "rust_engineio"
version = "0.6.0"
authors = ["Bastian Kersting <bastian@cmbt.de>"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "An implementation of a engineio client written in rust."
readme = "README.md"
keywords = ["engineio", "network", "protocol", "client"]
categories = ["network-programming", "web-programming", "web-programming::websocket"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
base64.workspace = true
bytes.workspace = true
futures-util.workspace = true
http.workspace = true
log.workspace = true
native-tls = { workspace = true, optional = true }
reqwest.workspace = true
rustls = { workspace = true, optional = true }
rustls-pki-types = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "net"] }
tokio-tungstenite.workspace = true
url.workspace = true
webpki-roots = { workspace = true, optional = true }

[dev-dependencies]
criterion = { version = "0.8", features = ["async_tokio"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

[[bench]]
name = "engineio"
harness = false
required-features = ["sync", "async", "rustls"]

[lib]
bench = false

[features]
default = ["async", "sync", "rustls"]
## Async (tokio) client.
async = ["async-callbacks"]
async-callbacks = []
## Blocking client (reqwest blocking + a private current-thread runtime per transport).
sync = ["reqwest/blocking"]
## TLS through rustls (ring provider, Mozilla roots from webpki-roots unless a TlsConfig is given).
rustls = ["dep:rustls", "dep:rustls-pki-types", "dep:webpki-roots", "reqwest/rustls-no-provider", "tokio-tungstenite/rustls-tls-webpki-roots"]
## TLS through the platform library (OpenSSL on Linux, Security.framework on macOS, SChannel on Windows).
native-tls = ["dep:native-tls", "reqwest/native-tls", "tokio-tungstenite/native-tls"]
