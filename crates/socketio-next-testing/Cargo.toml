[package]
name = "socketio-next-testing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Test support for socket.io clients: in-process Socket.IO v4 / Engine.IO v4 fake servers, fault-injecting TCP and HTTP proxies"
documentation = "https://docs.rs/socketio-next-testing"
readme = "README.md"
keywords = ["socketio", "engineio", "testing", "mock", "websocket"]
categories = ["development-tools::testing", "network-programming"]
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE"]

[lints]
workspace = true

[features]
## What only works in the socketio-next repository checkout: the test CA, the Node
## conformance servers and the differential harness (`ci/`).
repo = ["tokio/process"]

[dependencies]
base64 = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "rt", "rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = { workspace = true }
url = { workspace = true }
